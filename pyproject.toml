[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "4.20.0"
description = "Local Valorant coach: HenrikDev match data + replay files + VOD sync + minimap parsing + Ollama coaching, with a web app"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",   # no GUI parts: works on servers without libGL
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "flask>=3.1",
  "werkzeug>=3.1",                 # imported directly (also comes with Flask)
  "markupsafe>=2.1",               # imported directly (also comes with Flask)
  "urllib3>=1.26",                 # web search reads pages over the checked address (also comes with requests)
  "waitress>=3.0",
  "pywebpush>=2.0",                # push notifications for the installed app
  "pyarrow>=15",                   # reads the tables vrfkit makes from the game's replay files (4.9)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.setuptools.package-data]
nexus = ["web/templates/*.html", "web/static/*", "web/static/styles/*.css", "web/static/fonts/*", "web/static/styles/previews/*", "web/static/icons/*", "web/templates/*.js", "web/playbook_example.yaml", "replay.js", "stats/pros.yaml", "stats/comp_rules.yaml", "i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Linting only (no reformatting). target-version makes ruff reject syntax that needs a newer Python
# than requires-python, like the nested f-string quotes that broke 3.11 in 4.1.1.
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]   # ruff's defaults: syntax errors, undefined/unused names, imports
ignore = [
  "E731",   # small lambdas assigned to names are fine here
  "E741",   # `l` as a short loop name is fine here
]

[tool.ruff.lint.per-file-ignores]
"nexus/web/__init__.py" = ["E402"]   # some imports have to come after the app's constants
"tests/*" = ["E702"]
