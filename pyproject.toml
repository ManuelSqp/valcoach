[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valcoach"
version = "2.19.1"
description = "Local Valorant coach: HenrikDev match data + VOD sync + minimap parsing + Ollama coaching, with a web app"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",   # no GUI parts: works on servers without libGL
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "flask>=3.1",
  "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
valcoach = "valcoach.cli:main"

[tool.setuptools.packages.find]
include = ["valcoach*"]

[tool.setuptools.package-data]
valcoach = ["web/templates/*.html", "web/static/*", "web/playbook_example.yaml", "replay.js", "stats/pros.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
