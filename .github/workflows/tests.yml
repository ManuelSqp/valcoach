# Runs the linter and the test suite on every pull request and on pushes to main, so nothing broken gets merged.
# The tests build their own synthetic matches and a short synthetic VOD: no API keys, no Ollama needed.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      # Settings are in pyproject.toml ([tool.ruff]); target-version py311 also catches syntax 3.11 can't run.
      - run: ruff check valcoach tests companion

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest version pyproject.toml allows (requires-python) and the one most servers run.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: ffmpeg (clips)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q -p no:cacheprovider
