# Runs the test suite on every pull request and on pushes to main, so nothing broken gets merged.
# The tests build their own synthetic matches and a short synthetic VOD: no API keys, no Ollama needed.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg (clips)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q -p no:cacheprovider
