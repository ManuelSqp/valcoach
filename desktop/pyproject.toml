[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-desktop"
dynamic = ["version"]
description = "Nexus for Windows: the coach in an app window, plus KovaaK's playlists and scores and matches cut out of Medal recordings"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "keyring>=24",
  "pystray>=0.19",
  "pillow>=10",
  "imageio-ffmpeg>=0.5",
  "pywebview>=5.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.gui-scripts]
nexus = "nexus_desktop.app:main"

[tool.setuptools]
packages = ["nexus_desktop"]

[tool.setuptools.dynamic]
version = {attr = "nexus_desktop.__version__"}
