{% extends "base.html" %}
{% block title %}{{ code }} · valcoach{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:60px auto;text-align:center">
  <h1 style="font-size:40px;color:var(--red)">{{ code }}</h1>
  <p>{{ msg }}</p>
  {% if user %}<a class="btn" href="{{ url_for('index') }}">Back to your players</a>{% endif %}
</div>
{% endblock %}
