<div class="tabs" style="display:flex;gap:4px;margin:4px 0 18px;border-bottom:1px solid var(--line)">
  <a class="ttab {{ 'on' if tab == 'stats' }}" href="{{ url_for('stats', pid=p.id, queue=queue) }}">Stats &amp; agents</a>
  <a class="ttab {{ 'on' if tab == 'progress' }}" href="{{ url_for('progress', pid=p.id, queue=queue) }}">Progress</a>
  <a class="ttab {{ 'on' if tab == 'training' }}" href="{{ url_for('training', pid=p.id) }}">Training</a>
  <a class="ttab {{ 'on' if tab == 'pros' }}" href="{{ url_for('pros', pid=p.id, queue=queue) }}">Pro &amp; videos</a>
  {% if can_edit is not defined or can_edit %}<a class="ttab" href="{{ url_for('profile', pid=p.id) }}">Matches &amp; reports</a>{% endif %}
</div>
<style>
.ttab{padding:8px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.ttab:hover{color:var(--text)}.ttab.on{color:var(--text);border-bottom-color:var(--red)}
@media(max-width:760px){.tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.ttab{white-space:nowrap;padding:8px 10px;flex:none}}
</style>
