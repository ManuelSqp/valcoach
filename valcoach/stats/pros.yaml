# Pro players to compare playstyles with. Admins can edit this under Settings -> Pro players.
#
# This is a starting list written from public play styles as of mid-2026: rosters change,
# players retire or switch roles. Check it, remove who's no longer relevant, add who you like.
#
# style values are 0..1 and relative to other pros:
#   opening   how often they take the first duel of a round (entry vs. holding back)
#   kills     kills per round
#   assists   assists per round (utility, flashes, trading for others)
#   survive   how often they're alive at the end of rounds (opposite of dying a lot)
# role is one of Duelist, Initiator, Controller, Sentinel; agents are their main agents.
pros:
  - name: aspas
    role: Duelist
    agents: [Jett, Raze, Neon]
    style: {opening: 0.95, kills: 0.9, assists: 0.25, survive: 0.45}
    known_for: very aggressive entry, wins opening duels with movement and aim
